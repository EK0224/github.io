    <article class="essay-article-body">

  <div class="poem">

    <p>
      谁也不成想<br><br>

      一句话的诺言<br><br>

      错过就注定了离别<br><br>

      我在六月六日来到约定的地点<br><br>

      栈桥灯下，海涛无言<br><br>

      这里本该是一捧新雪<br><br>

      却由我一个人<br><br>

      暖成了夏夜
    </p>
