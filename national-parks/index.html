<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>National Parks · A Tiny Fragment of the World</title>
<meta name="description" content="A personal map of America's national parks.">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css">
<style>
:root{--ink:#35453f;--muted:#7c857d;--paper:#faf8f1;--green:#547863;--border:#d9ddd3}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,'PingFang SC',sans-serif;color:var(--ink);background:#dbe5e3}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:4px}#map{position:absolute;inset:0}header{position:absolute;z-index:5;top:28px;left:34px;right:34px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.heading,.toolbar{pointer-events:auto}.eyebrow{font-size:10px;letter-spacing:2px;margin:0 0 12px;color:#64746b}h1{font-family:Georgia,serif;font-size:40px;font-weight:400;letter-spacing:-1px;margin:0 0 12px}.legend{font-size:12px;display:flex;gap:16px;align-items:center}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#668e70;margin-right:6px}.dot.gray{background:#aaa}.progress{font-size:12px;color:var(--muted);margin-top:12px}.toolbar{display:flex;gap:6px}.pill{border:1px solid rgba(215,221,212,.85);background:rgba(250,248,241,.9);border-radius:24px;padding:11px 17px;font-size:12px;box-shadow:0 3px 12px #35453f06}.pill:hover,.pill[aria-pressed=true]{background:var(--ink);color:var(--paper)}.regions{position:absolute;z-index:5;bottom:34px;left:34px;display:flex;gap:7px;flex-wrap:wrap;max-width:70%}.regions button{padding:10px 14px}.hint{position:absolute;z-index:3;bottom:86px;left:35px;color:#76857d;font-size:11px;pointer-events:none}#leaders{position:absolute;inset:0;pointer-events:none;z-index:1}.park-marker{padding:0;width:68px;height:68px;background:none;border:0;cursor:pointer;transition:width .15s,height .15s}.park-marker img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 3px #293e3720);transition:filter .2s,transform .2s;pointer-events:none}.park-marker.unvisited img,.card.unvisited img{filter:grayscale(1) brightness(1.2) drop-shadow(0 3px 2px #293e3714)}.park-marker:hover img,.park-marker:focus-visible img{transform:scale(1.18)}.park-marker.selected{z-index:10}.park-marker.selected img{transform:scale(1.15)}.maplibregl-popup-content{background:var(--paper);border-radius:14px;padding:20px 23px;box-shadow:0 8px 30px #293e3726;min-width:215px}.maplibregl-popup-tip{border-top-color:var(--paper)!important}.popup-name{font-family:Georgia,serif;font-size:22px;margin:0 0 5px}.popup-zh{font-size:12px;color:var(--muted);margin:0 0 13px}.popup-date{font-size:12px;border-top:1px solid var(--border);padding-top:12px;margin:0}.maplibregl-popup-close-button{padding:5px 10px;font-size:20px}.maplibregl-ctrl-bottom-right{bottom:22px;right:25px}.maplibregl-ctrl-attrib{background:rgba(250,248,241,.8)!important;font-size:9px!important}#drawer{position:absolute;z-index:7;right:22px;top:85px;bottom:74px;width:330px;background:rgba(250,248,241,.97);border:1px solid var(--border);border-radius:20px;box-shadow:0 10px 50px #35453f19;display:flex;flex-direction:column;overflow:hidden}#drawer[hidden]{display:none}.drawer-head{padding:22px 22px 16px}.drawer-head h2{font-family:Georgia,serif;font-weight:400;margin:0 0 16px;font-size:24px}.search{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:#fffdf9;font-size:13px}.list-tabs{display:flex;gap:6px;margin-top:12px}.list-tabs button{background:none;border:0;padding:5px 8px;color:var(--muted);font-size:11px}.list-tabs button.active{color:var(--green);background:#e8ede5;border-radius:5px}#park-list{overflow:auto;padding:0 12px 12px}.card{width:100%;display:flex;align-items:center;gap:12px;padding:9px;border:0;border-bottom:1px solid #e7e8df;background:none;text-align:left}.card:hover{background:#eef1e8;border-radius:9px}.card img{width:56px;height:56px;object-fit:contain}.card strong{font-size:12px;font-weight:500;display:block;margin-bottom:5px}.card small{font-size:10px;color:var(--muted)}#status{position:absolute;z-index:6;left:50%;top:53%;transform:translate(-50%,-50%);background:var(--paper);padding:18px 24px;border-radius:12px;max-width:340px;font-size:13px;line-height:1.6;text-align:center}#status[hidden]{display:none}#status button{margin-top:10px}#mode{min-width:83px}.maplibregl-ctrl-group{border-radius:12px!important;overflow:hidden;background:var(--paper)!important}
@media(max-width:700px){header{top:20px;left:20px;right:20px}.eyebrow{font-size:8px;letter-spacing:1px}h1{font-size:29px}.toolbar{flex-direction:column;gap:5px}.pill{padding:9px 12px}.legend{font-size:10px;gap:11px}.regions{left:20px;bottom:30px;max-width:84%;gap:5px}.regions button{font-size:10px;padding:8px 10px}.hint{left:21px;bottom:110px;font-size:10px;max-width:190px}.maplibregl-ctrl-bottom-right{right:13px;bottom:110px}#drawer{right:12px;left:12px;width:auto;top:135px;bottom:80px}.progress{font-size:10px}.park-marker{width:54px;height:54px}}
.park-marker,.icon-disc{border-radius:50%;background:rgba(255,255,255,.78);border:1px solid #fff;box-shadow:0 0 0 3px rgba(255,255,255,.7),0 5px 12px #35453f18;isolation:isolate}
.park-marker{position:absolute}.icon-disc{position:relative}
.park-marker::before,.icon-disc::before{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #e3e7df;z-index:0;pointer-events:none}
.park-marker>img,.icon-disc>img{position:relative;z-index:1;width:84%;height:84%;margin:8%;object-fit:contain}
.park-marker:hover,.park-marker:focus-visible{box-shadow:0 0 0 3px #fff,0 7px 18px #35453f28}
.card .icon-disc{display:block;width:56px;height:56px;flex-shrink:0}
.card .icon-disc>img{width:84%;height:84%}
.city-label{display:flex;align-items:center;gap:5px;pointer-events:none;color:#718079;font-size:10px;white-space:nowrap;letter-spacing:.1px;opacity:.82;text-shadow:0 0 3px #f8f8f1,0 0 6px #f8f8f1}
.city-label::before{content:"";width:3px;height:3px;background:#8c9a90;border-radius:50%;box-shadow:0 0 0 1px #f5f6ee}
@media(max-width:700px){.city-label{font-size:9px;gap:4px}}
.park-detail{border:0;background:transparent;padding:24px;width:min(920px,96vw);max-width:none;max-height:92vh;overflow:auto;color:var(--ink)}
.park-detail::backdrop{background:rgba(41,55,48,.27);backdrop-filter:blur(4px)}
.detail-stage{display:flex;align-items:center;justify-content:center;gap:32px;position:relative;perspective:1100px}
.park-detail[open] .detail-stage{animation:flip-up .48s cubic-bezier(.2,.8,.2,1) both;transform-origin:center bottom}
.detail-icon{width:320px;height:320px;flex:0 0 320px;margin:0;box-shadow:0 0 0 5px #ffffffa6,0 12px 35px #263b3324}
.detail-icon::before{inset:12px}.detail-icon>img{width:88%;height:88%;margin:6%;filter:drop-shadow(0 5px 5px #293e3719)}
.detail-icon.unvisited>img{filter:grayscale(1) brightness(1.2) drop-shadow(0 5px 5px #293e3719)}
.detail-panel{flex:1;max-width:470px;min-width:0;background:#fbfaf4;border:1px solid #ffffffd9;border-radius:18px;padding:34px 36px;box-shadow:0 12px 35px #263b3324;position:relative}
.detail-kicker{font-size:9px;letter-spacing:2px;color:#829186;margin:0 0 12px}.detail-panel h2{font:normal 31px/1.15 Georgia,serif;letter-spacing:-.5px;margin:0 25px 7px 0}.detail-zh{font-size:12px;color:var(--muted);margin:0 0 21px}
.detail-description{font-size:14px;line-height:1.7;color:#5c6c61;margin:0 0 22px}.detail-meta{display:grid;grid-template-columns:1fr;gap:14px;margin:0 0 23px}.detail-meta div{display:grid;gap:4px}.detail-meta dt,.highlights-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#8c968d}.detail-meta dd{margin:0;font-size:12px;line-height:1.5}.detail-highlights{border-top:1px solid #e1e5da;padding-top:19px}.highlights-label{margin:0 0 10px}.detail-highlights ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:7px}.detail-highlights li{font-size:11px;line-height:1.5;color:#637360;background:#edf0e7;border-radius:5px;padding:5px 8px}.detail-source{display:inline-block;margin-top:18px;font-size:10px;color:#72876e;text-decoration:none}.detail-source:hover{text-decoration:underline}
#detail-visit-row[hidden]{display:none}
.detail-close{position:absolute;right:14px;top:13px;width:30px;height:30px;border:0;border-radius:50%;background:#edf0e7;color:#74816f;font-size:21px;line-height:1}
@keyframes flip-up{from{opacity:0;transform:perspective(1100px) translateY(45px) rotateX(28deg) scale(.88)}to{opacity:1;transform:perspective(1100px) translateY(0) rotateX(0) scale(1)}}
@media(max-width:700px){.park-detail{width:96vw;padding:15px}.detail-stage{flex-direction:column;gap:20px}.detail-icon{width:220px;height:220px;flex-basis:220px}.detail-panel{width:100%;max-width:440px;padding:28px}.detail-panel h2{font-size:27px}.detail-description{font-size:13px;margin-bottom:18px}.detail-meta{gap:11px;margin-bottom:18px}}
@media(prefers-reduced-motion:reduce){.park-detail[open] .detail-stage{animation:none}}
.home-link{color:inherit;text-decoration:none}.home-link:hover{text-decoration:underline}.home-link:focus-visible{outline:2px solid var(--green);outline-offset:4px}
</style>
</head>
<body>
<div id="map" role="region" aria-label="Interactive national park map"></div><canvas id="leaders" aria-hidden="true"></canvas>
<header><div class="heading"><p class="eyebrow"><a class="home-link" href="../index.html" aria-label="Return to homepage">← A TINY FRAGMENT OF THE WORLD</a></p><h1>National Parks</h1><div class="legend"><span><i class="dot"></i>Visited</span><span><i class="dot gray"></i>Not yet</span></div><div class="progress" id="progress"></div></div><nav class="toolbar" aria-label="Map controls"><button class="pill" id="mode" aria-pressed="false">Flat view</button><button class="pill" id="open-list" aria-expanded="false" aria-controls="drawer">Park list</button></nav></header>
<p class="hint">Drag to explore · Scroll to zoom<br>Right-drag to tilt · Select a park</p>
<nav class="regions" aria-label="Regions"><button class="pill" data-region="home">Mainland</button><button class="pill" data-region="alaska">Alaska</button><button class="pill" data-region="hawaii">Hawaiʻi</button><button class="pill" data-region="caribbean">Virgin Islands</button><button class="pill" data-region="samoa">American Samoa</button></nav>
<aside id="drawer" hidden aria-label="Park directory"><div class="drawer-head"><h2>Your park atlas</h2><input class="search" id="search" type="search" placeholder="Find a park…" aria-label="Search parks"><div class="list-tabs"><button data-filter="all" class="active">All 63</button><button data-filter="visited">Visited 21</button><button data-filter="unvisited">Not yet 42</button></div></div><div id="park-list"></div></aside>
<div id="status" role="status">Loading your atlas…</div>
<dialog id="park-detail" class="park-detail" aria-labelledby="detail-name" aria-describedby="detail-description">
 <div class="detail-stage">
  <figure id="detail-icon" class="icon-disc detail-icon"><img id="detail-art" alt=""></figure>
  <article class="detail-panel"><button id="detail-close" class="detail-close" aria-label="Close park details" autofocus>×</button>
   <p class="detail-kicker">NATIONAL PARK</p><h2 id="detail-name"></h2><p id="detail-zh" class="detail-zh"></p>
   <p id="detail-description" class="detail-description"></p>
   <dl class="detail-meta"><div><dt>State / territory</dt><dd id="detail-state"></dd></div><div id="detail-visit-row"><dt>First visit</dt><dd id="detail-visit"></dd></div></dl>
   <section class="detail-highlights"><p class="highlights-label">Highlights</p><ul id="detail-highlights"></ul></section>
   <a id="detail-source" class="detail-source" target="_blank" rel="noopener noreferrer">Explore on NPS ↗</a>
  </article>
 </div>
</dialog>
<script src="parks-data.js"></script><script src="park-details.js"></script><script src="app.js"></script>
</body></html>
