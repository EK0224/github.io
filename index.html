<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Tiny Fragment of the World</title>

  <link rel="stylesheet" href="./style.css?v=8">

<style>
  html,
  body {
    background: #B9BCA5;
  }

  .featured-note {
    color: #625F50;
  }

  html, body { min-height: 100vh; background: #dbe5e3; }
  .homepage { width: 100%; margin: 0; }
  .featured-work { position: fixed; inset: 0; width: 100%; max-width: none; margin: 0; z-index: 0; }
  .featured-image-link { width: 100%; height: 100%; pointer-events: none; }
  .featured-image { display: block; width: 100%; height: 100%; aspect-ratio: auto; object-fit: cover; object-position: center; }
  .featured-info, .site-footer { display: none; }
  .site-header { position: relative; z-index: 1; width: 100%; margin: 0; padding: 22px 32px; background: rgba(250,248,241,.82); }
  @media(max-width:700px) { .site-header { padding: 18px; } }
</style>
  
</head>

<body>

  <header class="site-header">

    <a class="site-title" href="index.html">
    <img
      src="./logo.png"
      alt=""
      class="site-logo"
      aria-hidden="true"
      width="135"
      height="135"
    >
      <span>A Tiny Fragment of the World</span>
    </a>

    <nav class="site-nav">
      <a href="travel.html">Travel</a>
      <a href="national-parks/">National Parks</a>
      <a href="photography.html">Photography</a>
      <a href="essays.html">Perspective</a>
      <a href="cover.html">Cover</a>
      <a href="about.html">About</a>
    </nav>

  </header>


  <main class="homepage">

    <article id="featured-work" class="featured-work">

      <a
        id="cover-link"
        href="#"
        class="featured-image-link"
      >
        <img
          id="cover-image"
          src="cover/2026-09-V2/homepage.png"
          alt="Homepage cover"
          class="featured-image"
        >
      </a>


      <div class="featured-info">

        <a
          id="cover-title"
          href="#"
          class="featured-title"
        ></a>

        <div
          id="cover-meta"
          class="featured-meta"
        ></div>

        <div
          id="cover-type"
          class="featured-type"
        ></div>
        
        <div
          id="cover-note"
          class="featured-note"
        ></div>
        
      </div>

    </article>

  </main>


  <footer class="site-footer">
    All text and images © 2026 Keleidocio. All rights reserved.
  </footer>




</body>

</html>
