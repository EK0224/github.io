<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Tiny Fragment of the World</title>

  <link rel="stylesheet" href="./style.css?v=6">

<style>
  html,
  body {
    background: #C1C2A9;
  }

  .featured-note {
    color: #625F50;
  }
</style>
  
</head>

<body>

  <header class="site-header">

    <a class="site-title" href="index.html">
    <img
      src="./logo.png"
      alt=""
      class="site-logo"
      aria-hidden="true"
      width="135"
      height="135"
    >
      <span>A Tiny Fragment of the World</span>
    </a>

    <nav class="site-nav">
      <a href="travel.html">Travel</a>
      <a href="photography.html">Photography</a>
      <a href="essays.html">Perspective</a>
      <a href="cover.html">Cover</a>
      <a href="about.html">About</a>
    </nav>

  </header>


  <main class="homepage">

    <article id="featured-work" class="featured-work">

      <a
        id="cover-link"
        href="#"
        class="featured-image-link"
      >
        <img
          id="cover-image"
          src=""
          alt=""
          class="featured-image"
        >
      </a>


      <div class="featured-info">

        <a
          id="cover-title"
          href="#"
          class="featured-title"
        ></a>

        <div
          id="cover-meta"
          class="featured-meta"
        ></div>

        <div
          id="cover-type"
          class="featured-type"
        ></div>
        
        <div
          id="cover-note"
          class="featured-note"
        ></div>
        
      </div>

    </article>

  </main>


  <footer class="site-footer">
    All text and images © 2026 Keleidocio. All rights reserved.
  </footer>


  <script>
    fetch("./cover/cover.json", { cache: "no-store" })

      .then(response => {
        if (!response.ok) {
          throw new Error("Could not load cover.json");
        }

        return response.json();
      })

      .then(cover => {

        const work = document.getElementById("featured-work");
        const image = document.getElementById("cover-image");
        const imageLink = document.getElementById("cover-link");
        const title = document.getElementById("cover-title");
        const meta = document.getElementById("cover-meta");
        const type = document.getElementById("cover-type");
        const note = document.getElementById("cover-note");

        image.src = cover.image;
        image.alt = cover.alt || cover.title || "";

        imageLink.href = cover.link || "#";
        title.href = cover.link || "#";

        title.textContent = cover.title || "";
        meta.textContent = cover.meta || "";
        type.textContent = cover.type || "";
        note.textContent = cover.note || "";

        const layout = cover.layout || {};

        image.style.setProperty(
          "--cover-aspect-ratio",
          layout.aspectRatio || "2 / 1"
        );

        image.style.setProperty(
          "--cover-object-position",
          layout.objectPosition || "center"
        );

        work.style.setProperty(
          "--cover-width",
          layout.width || "100%"
        );

        work.style.setProperty(
          "--cover-max-width",
          layout.maxWidth || "1320px"
        );

        work.style.setProperty(
          "--cover-margin-top",
          layout.marginTop || "90px"
        );

        work.style.setProperty(
          "--cover-margin-bottom",
          layout.marginBottom || "240px"
        );

        image.style.setProperty(
          "--cover-image-max-height",
          layout.imageMaxHeight || "none"
        );
      })

      .catch(error => {
        console.error("Cover loading error:", error);
      });

  </script>

</body>

</html>
