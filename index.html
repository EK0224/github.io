<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Tiny Fragment of the World</title>

  <link rel="stylesheet" href="./style.css?v=8">

<style>
  html, body { min-height: 100%; background: #B9BCA5; }
  body::before { content: ""; position: fixed; inset: 0; z-index: 0; background: url("cover/2026-09-V2/homepage.png") center / cover no-repeat; pointer-events: none; }
  .site-header, .homepage, .site-footer { position: relative; z-index: 1; }
  .site-header { background: transparent; flex-wrap: wrap; }
  .site-nav { flex-wrap: wrap; }
  .site-nav a { white-space: nowrap; }
  .featured-work { width: 100%; max-width: none; margin: 0; padding: clamp(240px, 52vh, 650px) 0 80px; }
  .featured-image-link { display: none; }
  .featured-info { margin-top: 0; }
  .site-title, .site-nav a, .featured-title, .featured-meta, .featured-type, .featured-note, .site-footer { text-shadow: 0 1px 8px rgba(255,255,255,.75); }
  .featured-note { color: #625F50; }
  @media(max-width:700px) { .featured-work { padding: 40vh 0 55px; } }
</style>
  
</head>

<body>

  <header class="site-header">

    <a class="site-title" href="index.html">
    <img
      src="./logo.png"
      alt=""
      class="site-logo"
      aria-hidden="true"
      width="135"
      height="135"
    >
      <span>A Tiny Fragment of the World</span>
    </a>

    <nav class="site-nav">
      <a href="travel.html">Travel</a>
      <a href="national-parks/">National Parks</a>
      <a href="photography.html">Photography</a>
      <a href="essays.html">Perspective</a>
      <a href="cover.html">Cover</a>
      <a href="about.html">About</a>
    </nav>

  </header>


  <main class="homepage">

    <article id="featured-work" class="featured-work">

      <a
        id="cover-link"
        href="#"
        class="featured-image-link"
      >
        <img
          id="cover-image"
          src=""
          alt=""
          class="featured-image"
        >
      </a>


      <div class="featured-info">

        <a
          id="cover-title"
          href="#"
          class="featured-title"
        ></a>

        <div
          id="cover-meta"
          class="featured-meta"
        ></div>

        <div
          id="cover-type"
          class="featured-type"
        ></div>
        
        <div
          id="cover-note"
          class="featured-note"
        ></div>
        
      </div>

    </article>

  </main>


  <footer class="site-footer">
    All text and images © 2026 Keleidocio. All rights reserved.
  </footer>


  <script>
    fetch("./cover/cover.json", { cache: "no-store" })
      .then(response => {
        if (!response.ok) throw new Error("Could not load cover.json");
        return response.json();
      })
      .then(cover => {
        document.getElementById("cover-title").href = cover.link || "cover.html";
        document.getElementById("cover-title").textContent = cover.title || "";
        document.getElementById("cover-meta").textContent = cover.meta || "";
        document.getElementById("cover-type").textContent = cover.type || "";
        document.getElementById("cover-note").textContent = cover.note || "";
      })
      .catch(error => console.error("Cover loading error:", error));
  </script>

</body>

</html>
